[supervisord]
nodaemon=true
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log
startsecs=10

[program:spring-boot]
command=java -Xms256m -Xmx1048m -jar /java-server/javaserver-0.0.1-SNAPSHOT.jar --server.port=8077
autostart=true
autorestart=true
stderr_logfile=/var/log/spring-boot.err.log
stdout_logfile=/var/log/spring-boot.out.log
startsecs=75